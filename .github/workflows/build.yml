# Compila o TapGlobalPatcher.exe a partir do código-fonte num runner do GitHub,
# publica o SHA-256 e gera um atestado de origem (provenance) do binário.
# Em tags v*, anexa o .exe à release.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compilar
        shell: cmd
        run: app\build.bat

      - name: SHA-256
        shell: pwsh
        run: |
          $h = (Get-FileHash dist\TapGlobalPatcher.exe -Algorithm SHA256).Hash.ToLower()
          "$h  TapGlobalPatcher.exe" | Out-File -Encoding ascii dist\SHA256SUMS.txt
          "SHA-256: $h" >> $env:GITHUB_STEP_SUMMARY

      - name: Atestado de origem
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/TapGlobalPatcher.exe

      - uses: actions/upload-artifact@v4
        with:
          name: TapGlobalPatcher
          path: dist/

      - name: Anexar à release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" dist/TapGlobalPatcher.exe dist/SHA256SUMS.txt --clobber
